<!doctype html>
<meta charset="utf-8">
<title>showreel encoder</title>
<script type="module">
// Encode out/frames/*.jpg + out/mix.wav into an MP4 with WebCodecs (H.264 High + AAC),
// muxed by mp4-muxer, and post it to /save (encode.mjs writes docs/showreel.mp4).
import { ArrayBufferTarget, Muxer } from "./vendor/mp4-muxer.mjs";
import { DURATION, FPS, H, W } from "./timeline.mjs";

const q = new URLSearchParams(location.search);
const VBR = Number(q.get("vbr") ?? 12e6);
const ACODEC = q.get("acodec") ?? "mp4a.40.2";
const N = Math.round(DURATION * FPS);
const fail = (e) => { window.__err = String(e?.message ?? e); console.error(window.__err); };

const muxer = new Muxer({
  target: new ArrayBufferTarget(),
  video: { codec: "avc", width: W, height: H, frameRate: FPS },
  audio: { codec: ACODEC.startsWith("mp4a") ? "aac" : "opus", numberOfChannels: 2, sampleRate: 48000 },
  fastStart: "in-memory",
  firstTimestampBehavior: "offset",
});

// ---- video ----
const venc = new VideoEncoder({ output: (chunk, meta) => muxer.addVideoChunk(chunk, meta), error: fail });
venc.configure({ codec: "avc1.640028", width: W, height: H, bitrate: VBR, bitrateMode: "variable", framerate: FPS, latencyMode: "quality", avc: { format: "avc" } });
const pad = (i) => String(i).padStart(5, "0");
const t0 = performance.now();
for (let i = 0; i < N; i++) {
  const blob = await (await fetch(`/out/frames/${pad(i)}.jpg`)).blob();
  const bmp = await createImageBitmap(blob);
  const frame = new VideoFrame(bmp, { timestamp: Math.round((i * 1e6) / FPS), duration: Math.round(1e6 / FPS) });
  venc.encode(frame, { keyFrame: i % (FPS * 2) === 0 });
  frame.close(); bmp.close();
  while (venc.encodeQueueSize > 6) await new Promise((r) => setTimeout(r, 2));
  if (i % 600 === 0) console.log(`video ${i}/${N} (${((performance.now() - t0) / 1000).toFixed(0)} s)`);
  if (window.__err) throw new Error(window.__err);
}
await venc.flush();

// ---- audio ----
const wav = await (await fetch("/out/mix.wav")).arrayBuffer();
const buf = await new OfflineAudioContext(2, 48000, 48000).decodeAudioData(wav);
const aenc = new AudioEncoder({ output: (chunk, meta) => muxer.addAudioChunk(chunk, meta), error: fail });
aenc.configure({ codec: ACODEC, sampleRate: 48000, numberOfChannels: 2, bitrate: 192000 });
const L = buf.getChannelData(0), R = buf.getChannelData(1), STEP = 1024;
const total = Math.min(buf.length, Math.round(48000 * DURATION));
for (let off = 0; off < total; off += STEP) {
  const n = Math.min(STEP, total - off), data = new Float32Array(n * 2);
  data.set(L.subarray(off, off + n), 0); data.set(R.subarray(off, off + n), n);
  const ad = new AudioData({ format: "f32-planar", sampleRate: 48000, numberOfFrames: n, numberOfChannels: 2, timestamp: Math.round((off * 1e6) / 48000), data });
  aenc.encode(ad); ad.close();
}
await aenc.flush();

muxer.finalize();
const out = muxer.target.buffer;
await fetch(`/save?name=showreel.mp4`, { method: "POST", body: out });
window.__encoded = { bytes: out.byteLength, frames: N, seconds: DURATION, vbr: VBR, acodec: ACODEC, encodeSeconds: Math.round((performance.now() - t0) / 1000) };
</script>
